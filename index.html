<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mathe Lernwerkstatt</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#18283b;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:20px 14px 60px}header{background:#183b72;color:white;padding:25px 18px;border-radius:18px;margin-bottom:18px}h1{margin:0 0 5px;font-size:clamp(25px,5vw,35px)}h2{font-size:23px;margin:8px 0 10px}h3{margin:0 0 8px}p{line-height:1.5}.muted{color:#627186}.card{background:white;border-radius:15px;padding:18px;margin:14px 0;box-shadow:0 3px 14px #17345a12}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab,button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;font-size:15px}button{background:#1e5cb5;color:white}button:disabled{background:#a8b1bf;cursor:not-allowed}.tab{background:#e3eaf4;color:#244365}.tab.active{background:#1e5cb5;color:white}.tab.locked{opacity:.6}.questions{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}.question{border:1px solid #dbe3ee;border-radius:12px;padding:13px;background:#fff}.question label{display:block;font-weight:650;line-height:1.45;margin-bottom:8px}.question input{width:100%;border:2px solid #cbd5e1;border-radius:9px;padding:12px;font-size:17px;background:white;color:#17283d}.question input:focus{outline:3px solid #a9caff}.question.correct{background:#e8f8ec;border-color:#51b875}.question.wrong{background:#fff0f0;border-color:#d45b5b}.hint{font-size:13px;margin-top:7px;color:#a52f2f}.progress{height:11px;background:#dce4ef;border-radius:20px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:#2a9b65;transition:width .2s}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.notice{border-left:4px solid #1e5cb5;padding:12px;background:#eaf2ff;border-radius:8px;margin:12px 0}.success{border-left-color:#239658;background:#e8f8ec}.small{font-size:13px}.overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.tile{border:1px solid #dce3ed;border-radius:12px;padding:14px}.tile strong{display:block;margin-bottom:5px}.pill{font-size:12px;color:#596a7d}select{padding:10px;border:1px solid #aab9ca;border-radius:8px;background:white;font-size:15px}footer{color:#64748b;font-size:12px;margin-top:25px}@media(max-width:450px){.questions{grid-template-columns:1fr}.card{padding:14px}}
.numberline{position:relative;height:74px;margin:14px 10px 8px;touch-action:manipulation}.rail{position:absolute;top:27px;left:12px;right:12px;height:3px;background:#315d91}.ticks{position:absolute;top:15px;left:12px;right:12px;display:flex;justify-content:space-between}.tick{height:27px;border-left:2px solid #315d91;position:relative}.tick small{position:absolute;top:29px;left:50%;transform:translateX(-50%);font-size:11px}.point{position:absolute;top:10px;transform:translateX(-50%);font-size:25px;color:#c13e3e;pointer-events:none}.lineclick{position:absolute;top:0;left:12px;right:12px;height:60px;cursor:crosshair}.choices{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.choice{background:#e5edf9;color:#163d72;padding:9px 12px}.choice.selected{background:#164f9e;color:white}.answer-note{font-size:13px;color:#627186;margin-top:6px}.question.wide{grid-column:1/-1}button.secondary{background:#e6edf7;color:#163b70}.nav-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px}.sheet-list{display:grid;gap:14px}.sheet-card{width:100%;display:flex;align-items:center;gap:14px;text-align:left;padding:20px;background:white;color:#17283d;border:2px solid #e0e8f2;border-radius:17px;box-shadow:0 3px 14px #17345a12}.sheet-card:focus-visible{outline:3px solid #2475db}.sheet-card:hover{border-color:#1e5cb5}.sheet-number{flex:0 0 49px;width:49px;height:49px;border-radius:14px;background:#e6eefb;color:#1e5cb5;display:grid;place-items:center;font-size:23px}.sheet-copy{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}.sheet-copy strong{font-size:19px}.sheet-kicker{font-size:11px;letter-spacing:.07em;color:#61718a}.sheet-description{font-size:14px;font-weight:400;color:#627186;line-height:1.4}.sheet-status{font-size:13px;color:#1c5caa}.sheet-status.completed{color:#16824c}.sheet-chevron{font-size:30px;color:#8291a7}.home-intro{margin-top:0}.example{margin-top:12px;padding:11px 12px;background:#f0f7ff;border:1px solid #c7defa;border-radius:10px;color:#244565;font-size:14px;line-height:1.55}.example strong{display:block;color:#174b88;margin-bottom:3px}.example .worked{font-weight:650;color:#14365c}.example .method{font-size:13px;color:#48617c;margin-top:3px}.question .hint:empty{display:none}.example code{font-size:14px;white-space:normal}.question input{min-height:46px} </style></head><body><main><header><h1>📘 Mathe-Lernwerkstatt</h1><div>Üben · Musterbeispiele verstehen · Fehler wiederholen</div></header><div id="app"></div><footer>Dein Lernstand wird nur in diesem Browser auf diesem Gerät gespeichert. Keine Schülerdaten werden an einen Server übertragen.</footer></main><script>
'use strict';
const KEY='mathe-lernwerkstatt-v3';const $=id=>document.getElementById(id);const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');const codes=['E','Z','H','T','ZT','HT','M','ZM','HM','Mrd'];const power=i=>10**i;const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function numberWords(n){if(n===0)return 'null';const u=['','ein','zwei','drei','vier','fünf','sechs','sieben','acht','neun'];const singles=['','eins','zwei','drei','vier','fünf','sechs','sieben','acht','neun'];const teens=['zehn','elf','zwölf','dreizehn','vierzehn','fünfzehn','sechzehn','siebzehn','achtzehn','neunzehn'];const tens=['','','zwanzig','dreißig','vierzig','fünfzig','sechzig','siebzig','achtzig','neunzig'];function under1000(x){let r='';if(x>=100){r+=u[Math.floor(x/100)]+'hundert';x%=100}if(x>=20){let t=Math.floor(x/10),z=x%10;r+=(z?u[z]+'und':'')+tens[t]}else if(x>=10)r+=teens[x-10];else if(x>0)r+=singles[x];return r}let result='';let billion=Math.floor(n/1e9);if(billion){result+=billion===1?'eine Milliarde ':' '+under1000(billion)+' Milliarden ';n%=1e9}let million=Math.floor(n/1e6);if(million){result+=(million===1?'eine Million ':under1000(million)+' Millionen ');n%=1e6}let thousand=Math.floor(n/1000);if(thousand){result+=(thousand===1?'ein':under1000(thousand))+'tausend';n%=1000}return (result+under1000(n)).trim().replace(/\s+/g,' ')}
function makePlaceNumber(){let len=rand(2,10);let s=String(rand(1,9));for(let i=1;i<len;i++)s+=String(rand(0,9));return Number(s)}
function expanded(n){return String(n).split('').map((digit,j,arr)=>digit!=='0'?digit+codes[arr.length-j-1]:'').filter(Boolean).join(' ')}
function parseExpanded(s){let clean=s.toUpperCase().replace(/\s/g,'').replace(/MRD/g,'B');let found=[...clean.matchAll(/(\d+)(ZT|HT|ZM|HM|M|B|T|H|Z|E)/g)];if(!found.length||found.map(m=>m[0]).join('')!==clean)return null;let seen=new Set(),sum=0;for(let m of found){let code=m[2],idx=code==='B'?9:codes.indexOf(code);if(idx<0||seen.has(idx)||Number(m[1])>9)return null;seen.add(idx);sum+=Number(m[1])*power(idx)}return sum}
function makeSheet1(){let q=[];for(let a=1;a<=10;a++)for(let b=1;b<=10;b++)q.push({id:`m-${a}-${b}`,kind:'mul',prompt:`${a} × ${b} =`,answer:a*b});return shuffle(q)}
function makeSheet2(){let q=[];for(let i=0;i<12;i++){let n=makePlaceNumber();q.push({id:'p1-'+i,section:0,kind:'expanded',prompt:`${fmt(n)} =`,answer:n})}for(let i=0;i<12;i++){let n=makePlaceNumber();q.push({id:'p2-'+i,section:1,kind:'number',prompt:`${expanded(n)} =`,answer:n})}for(let i=0;i<7;i++){let n=makePlaceNumber();q.push({id:'p3-'+i,section:2,kind:'number',prompt:`${numberWords(n)}:`,answer:n})}for(let i=0;i<8;i++){let n=makePlaceNumber();let pos=shuffle([...String(n)].map((d,i)=>({d,i}))).find(x=>x.d!=='0');let digit=pos.d,place=String(n).length-pos.i-1;q.push({id:'p4-'+i,section:3,kind:'place',prompt:`Welchen Stellenwert hat die Ziffer ${digit} in ${fmt(n)}?`,answer:codes[place],numeric:power(place)*Number(digit)})}return q}
function makeSheet3(){let q=[],add=(kind,prompt,answer,extra={})=>q.push({id:'n-'+q.length,kind,prompt,answer,...extra});
// 1a: read marked number line, 1b: place points on a number line
for(let i=0;i<3;i++){let start=rand(0,5)*10,step=rand(1,4),index=rand(1,8);add('lineRead','Welche Zahl ist mit dem roten Kreuz markiert?',start+step*index,{start,step,index})}
for(let i=0;i<2;i++){let start=rand(1,5)*100,step=rand(1,4)*25,index=rand(1,8);add('lineTap',`Tippe auf dem Zahlenstrahl die Zahl ${fmt(start+step*index)} an.`,index,{start,step,index})}
// 2: comparisons
for(let i=0;i<6;i++){let a=rand(0,9999),b=i%3===0?a:rand(0,9999);add('compare',`${fmt(a)} __ ${fmt(b)}`,a===b?'=':a>b?'>':'<')}
// 3: predecessor/successor, separate fields
for(let i=0;i<4;i++){let n=rand(10,99999);add('neighbors',`Vorgänger und Nachfolger von ${fmt(n)}`,`${n-1}|${n+1}`)}
// 4: order by selecting numbers in sequence
for(let i=0;i<4;i++){let vals=new Set();while(vals.size<6)vals.add(rand(0,9999));let a=[...vals],ascending=i%2===0;add('order',`Ordne die Zahlen ${ascending?'aufsteigend (kleinste zuerst)':'absteigend (größte zuerst)'}.`,[...a].sort((x,y)=>ascending?x-y:y-x).join('|'),{options:shuffle(a)})}
// 5: column addition
for(let i=0;i<3;i++){let vals=[rand(100,999),rand(1000,9999),rand(10,99),rand(10000,99999)];add('number',`Addiere schriftlich: ${vals.map(fmt).join(' + ')} =`,vals.reduce((a,b)=>a+b,0))}
// 6: subtraction + proof
for(let i=0;i<3;i++){let a=rand(2000,9999),b=rand(100,Math.min(1999,a-1));add('number',`Berechne die Differenz: ${fmt(a)} − ${fmt(b)} =`,a-b)}
// 7: multiplication
for(let i=0;i<4;i++){let a=rand(21,999),b=rand(12,99);add('number',`${fmt(a)} × ${fmt(b)} =`,a*b)}
// 8: division no remainder and with remainder
for(let i=0;i<2;i++){let divisor=rand(3,25),quotient=rand(20,600);add('number',`${fmt(divisor*quotient)} : ${divisor} = (ohne Rest)`,quotient)}
for(let i=0;i<2;i++){let divisor=rand(3,19),quotient=rand(30,600),rem=rand(1,divisor-1);add('division',`${fmt(divisor*quotient+rem)} : ${divisor} = (mit Rest)`,`${quotient}|${rem}`)}
// 9: word problems
for(let i=0;i<3;i++){let savings=rand(9,30)*1000+rand(100,999),cost=rand(2,8)*1000+rand(100,999);add('number',`Sachaufgabe: Auf dem Sparbuch liegen ${fmt(savings)} €. Ein Fahrrad oder Fahrzeug kostet ${fmt(cost)} €. Wie viel Euro bleiben übrig?`,savings-cost)}
// 10: multiply a sum
for(let i=0;i<3;i++){let a=rand(20,150),b=rand(10,90),c=rand(3,35);add('number',`Multipliziere die Summe von ${a} und ${b} mit ${c}.`,(a+b)*c)}
return q}
function initial(){return {version:3,sheets:[{questions:makeSheet1(),remaining:null,round:1,done:false,history:[]},{questions:makeSheet2(),remaining:null,round:1,done:false,history:[]},{questions:makeSheet3(),remaining:null,round:1,done:false,history:[]}],current:0,inputs:{}}}let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||state.version!==3||!Array.isArray(state.sheets)||state.sheets.length!==3){let old;try{old=JSON.parse(localStorage.getItem('mathe-lernwerkstatt-v2'))}catch{}state=initial();if(old&&old.version===2&&old.sheets?.length===2){state.sheets[0]=old.sheets[0];state.sheets[1]=old.sheets[1];state.current=old.current;state.inputs=old.inputs||{}}}let checked=null,section='all',page='home';function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}function currentSheet(){return state.sheets[state.current]}function pending(sh){return sh.remaining===null?sh.questions:sh.questions.filter(q=>sh.remaining.includes(q.id))}function normalize(s){return String(s??'').trim().toLowerCase().replace(/[.\s]/g,'').replace(/ß/g,'ss')}
function correct(q,v){let x=normalize(v);if(!x)return false;if(q.kind==='lineTap')return Number(x)===q.answer;if(q.kind==='compare')return x===q.answer;if(q.kind==='order'||q.kind==='neighbors'||q.kind==='division')return x===normalize(q.answer);if(q.kind==='expanded')return parseExpanded(v)===q.answer;if(q.kind==='place'){if(x===normalize(q.answer))return true;let names={E:['e','einer','einerstelle'],Z:['z','zehner','zehnerstelle'],H:['h','hunderter','hunderterstelle'],T:['t','tausender','tausenderstelle'],ZT:['zt','zehntausender'],HT:['ht','hunderttausender'],M:['m','million','millionen'],ZM:['zm','zehnmillionen'],HM:['hm','hundertmillionen'],Mrd:['mrd','milliarde','milliarden']};return names[q.answer].includes(x)||Number(x)===q.numeric}return /^\d+$/.test(x)&&Number(x)===q.answer}
// Jede einzelne Aufgabe zeigt ein vollständiges, anders gerechnetes Musterbeispiel.
function workedExample(q){
 const show=(task,solution,method)=>`<div class="example"><strong>💡 So geht’s – Beispiel</strong><div>${safe(task)}</div><div class="worked">${safe(solution)}</div><div class="method">${safe(method)}</div></div>`;
 if(q.kind==='mul')return show('6 × 7 = ?', '6 × 7 = 42','Sechsmal sieben bedeutet sechs Gruppen mit jeweils sieben.');
 if(q.kind==='expanded')return show('4 305 in Stellenwerte zerlegen','4 305 = 4T 3H 5E','T = Tausender, H = Hunderter, Z = Zehner, E = Einer. Stellen mit 0 kannst du weglassen.');
 if(q.kind==='place')return show('Welchen Stellenwert hat die 7 in 47 291?','7 = T (Tausender)','Von rechts zählen: Einer, Zehner, Hunderter, Tausender. Die 7 steht bei den Tausendern.');
 if(q.kind==='lineRead')return show('Zahlenstrahl: Start 10, jeder Strich + 5, Kreuz am 3. Strich nach dem Start','10 + 3 × 5 = 25','Lies die Beschriftung ab, ermittle die Schrittweite und zähle die Striche.');
 if(q.kind==='lineTap')return show('Zahlenstrahl von 100 in 20er-Schritten: Markiere 160','100 → 120 → 140 → 160','Tippe auf den dritten Strich nach 100.');
 if(q.kind==='compare')return show('Vergleiche 3 418 und 3 481','3 418 < 3 481','Von links vergleichen: Tausender und Hunderter gleich, bei den Zehnern ist 1 kleiner als 8.');
 if(q.kind==='neighbors')return show('Vorgänger und Nachfolger von 560','Vorgänger: 559 | Nachfolger: 561','Vorgänger = 1 weniger, Nachfolger = 1 mehr. Beide Felder ausfüllen.');
 if(q.kind==='order')return show('Ordne 28, 7, 41 aufsteigend','7 → 28 → 41','Aufsteigend: kleinste Zahl zuerst. Absteigend: größte Zahl zuerst. Tippe in der richtigen Reihenfolge.');
 if(q.kind==='division')return show('23 : 5 = ? (mit Rest)','Ergebnis: 4 | Rest: 3','5 × 4 = 20, und 23 − 20 = 3. Der Rest muss kleiner als 5 sein.');
 if(q.kind==='number' && q.prompt.includes('Sachaufgabe'))return show('Du hast 80 € und kaufst etwas für 35 €. Wie viel bleibt?','80 − 35 = 45 €','Vom Anfangsbetrag ziehst du die Kosten ab. Gib nur die Zahl ein.');
 if(q.kind==='number' && q.prompt.includes('Multipliziere die Summe'))return show('Multipliziere die Summe von 12 und 8 mit 4','(12 + 8) × 4 = 20 × 4 = 80','Zuerst die Summe in der Klammer berechnen, danach multiplizieren.');
 if(q.kind==='number' && q.prompt.includes('Addiere'))return show('Addiere 235 + 148','235 + 148 = 383','Schriftlich Einer unter Einer, Zehner unter Zehner, Hunderter unter Hunderter schreiben.');
 if(q.kind==='number' && q.prompt.includes('Differenz'))return show('Berechne 725 − 268','725 − 268 = 457','Schriftlich die kleinere Zahl von der größeren abziehen; bei Bedarf entbündeln.');
 if(q.kind==='number' && q.prompt.includes('ohne Rest'))return show('84 : 7 = ?','84 : 7 = 12','Prüfung: 12 × 7 = 84.');
 if(q.kind==='number' && q.prompt.includes('×'))return show('24 × 13 = ?','24 × 13 = 24 × 10 + 24 × 3 = 312','Zerlege den zweiten Faktor und addiere die Teilergebnisse.');
 if(q.kind==='number' && q.prompt.includes(':'))return show('96 : 8 = ?','96 : 8 = 12','Prüfe das Ergebnis durch 12 × 8 = 96.');
 if(q.kind==='number' && q.prompt.includes('Zahlwort'))return show('zweitausendvierhundertsechs als Ziffern','2 406','Tausender = 2, Hunderter = 4, Zehner = 0, Einer = 6.');
 if(q.kind==='number' && q.id.startsWith('p3-'))return show('siebentausenddreihundertfünf als Zahl','7 305','Die fehlenden Zehner bekommen eine 0. Nur Ziffern eingeben.');
 if(q.kind==='number' && q.id.startsWith('p2-'))return show('5T 2H 9E als Zahl','5 209','5 Tausender, 2 Hunderter, 0 Zehner und 9 Einer.');
 return show('36 + 27 = ?', '36 + 27 = 63','Rechne die Stellenwerte zusammen und gib die Zahl ein.');
}
const sections=['Stellenwerte aufschreiben','Als Zahl schreiben','Zahlwörter umwandeln','Stellenwert erkennen'];
function questionHTML(q,i){let v=state.inputs[q.id]||'',r=checked?checked.results[q.id]:null,klass=r===true?'correct':r===false?'wrong':'';let body='',locked=!!checked;
if(q.kind==='lineRead'||q.kind==='lineTap'){
let ticks=Array.from({length:11},(_,j)=>`<div class="tick"><small>${j===0||j===5||j===10?fmt(q.start+j*q.step):''}</small></div>`).join('');
body=`<div class="numberline"><div class="rail"></div><div class="ticks">${ticks}</div>${q.kind==='lineRead'?`<span class="point" style="left:calc(12px + (100% - 24px)*${q.index/10})">✕</span>`:`<div class="lineclick" role="slider" aria-label="Position auf dem Zahlenstrahl wählen" onclick="tapLine(event,'${q.id}')"></div>${v!==''?`<span class="point" style="left:calc(12px + (100% - 24px)*${Number(v)/10})">●</span>`:''}`}</div>`;
if(q.kind==='lineRead')body+=`<input type="text" inputmode="numeric" value="${safe(v)}" ${locked?'disabled':''} oninput="answer('${q.id}',this.value)" placeholder="Zahl eingeben">`;
else body+=`<div class="answer-note">${v!==''?'Gewählter Punkt: '+fmt(q.start+Number(v)*q.step):'Tippe auf einen Strich des Zahlenstrahls'}</div>`;
}else if(q.kind==='compare'){body=`<div class="choices">${['<','=','>'].map(op=>`<button class="choice ${v===op?'selected':''}" ${locked?'disabled':''} onclick="choose('${q.id}','${safe(op)}')">${op==='<'?'&lt;':op==='>'?'&gt;':'='}</button>`).join('')}</div>`}
else if(q.kind==='neighbors'||q.kind==='division'){let a=v.split('|');body=`<div class="questions"><div><label>${q.kind==='neighbors'?'Vorgänger':'Ergebnis'}</label><input inputmode="numeric" value="${safe(a[0]||'')}" ${locked?'disabled':''} oninput="pairAnswer('${q.id}',0,this.value)"></div><div><label>${q.kind==='neighbors'?'Nachfolger':'Rest'}</label><input inputmode="numeric" value="${safe(a[1]||'')}" ${locked?'disabled':''} oninput="pairAnswer('${q.id}',1,this.value)"></div></div>`}
else if(q.kind==='order'){let selected=v?v.split('|').filter(Boolean):[];body=`<div class="choices">${q.options.map(n=>`<button class="choice ${selected.includes(String(n))?'selected':''}" ${locked||selected.includes(String(n))?'disabled':''} onclick="pickOrder('${q.id}',${n})">${fmt(n)}</button>`).join('')}</div><div class="answer-note">Deine Reihenfolge: ${selected.length?selected.map(fmt).join(' → '):'Tippe die Zahlen der Reihe nach an'}</div>${!locked?`<button class="secondary" onclick="choose('${q.id}','')">Reihenfolge löschen</button>`:''}`}
else body=`<input type="text" inputmode="${q.kind==='expanded'||q.kind==='place'?'text':'numeric'}" autocomplete="off" autocapitalize="off" spellcheck="false" value="${safe(v)}" ${locked?'disabled':''} oninput="answer('${q.id}',this.value)" placeholder="Antwort eingeben">`;
return `<div class="question ${klass} ${['lineRead','lineTap','order'].includes(q.kind)?'wide':''}"><label>${i+1}. ${safe(q.prompt)}</label>${body}${workedExample(q)}<div class="hint">${r===true?'✓ Richtig':r===false?'✗ Noch nicht richtig':''}</div></div>`}
const titles=['Das kleine Einmaleins','Stellenwerte natürlicher Zahlen','Natürliche Zahlen – Wiederholung'];
const descriptions=['100 gemischte Multiplikationsaufgaben von 1 bis 10','Zahlen zerlegen, Stellenwerte, Zahlwörter und Ziffernpositionen','Zahlenstrahl, Vergleiche, Nachbarzahlen, Sortieren, Rechnen und Sachaufgaben'];
function renderHome(){let completed=state.sheets.filter(s=>s.done).length;let html=`<section class="card home-intro"><h2>Wähle dein Arbeitsblatt</h2><p class="muted">Du kannst jedes Arbeitsblatt direkt öffnen. Zu jeder Aufgabe gibt es ein eigenes Musterbeispiel mit Lösungsweg. Falsche Aufgaben werden wiederholt, bis du alle richtig hast.</p><div class="progress" aria-label="${completed} von 3 Arbeitsblättern abgeschlossen"><div style="width:${completed/3*100}%"></div></div><p class="small muted">${completed} von 3 Arbeitsblättern abgeschlossen</p></section><div class="sheet-list">`;
state.sheets.forEach((sh,i)=>{let remaining=pending(sh).length;let status=sh.done?'✓ Abgeschlossen':sh.round>1?'In Bearbeitung · Runde '+sh.round+' · '+remaining+' offen':'Noch nicht abgeschlossen';html+=`<button class="sheet-card" onclick="go(${i})" aria-label="Arbeitsblatt ${i+1}: ${safe(titles[i])} öffnen"><span class="sheet-number">${i+1}</span><span class="sheet-copy"><span class="sheet-kicker">ARBEITSBLATT ${i+1}</span><strong>${safe(titles[i])}</strong><span class="sheet-description">${safe(descriptions[i])}</span><span class="sheet-status ${sh.done?'completed':''}">${status}</span></span><span class="sheet-chevron">›</span></button>`});html+=`</div><div class="card"><details><summary><b>Lernstand und Einstellungen</b></summary><p class="small muted">Dein Lernstand wird nur in diesem Browser gespeichert.</p><button style="background:#a33434" onclick="resetAll()">Lernprogramm zurücksetzen</button></details></div>`;$('app').innerHTML=html}
function render(){if(page==='home'){renderHome();return}let sh=currentSheet(),list=pending(sh),index=state.current,isFirst=index===0,visible=index===1&&section!=='all'?list.filter(q=>q.section===Number(section)):list,count=state.sheets.filter(x=>x.done).length;
let html=`<div class="nav-bar"><button class="secondary" onclick="home()">← Zur Übersicht</button><span class="small muted">Arbeitsblatt ${index+1} von 3</span></div>`;
html+=`<div class="card"><h2>Arbeitsblatt ${index+1}: ${titles[index]}</h2><p class="muted">${index===0?'100 gemischte Malaufgaben.':index===1?'Vier Aufgabentypen mit eigenen Zahlen.':'Zahlenstrahl, Vergleiche, Nachbarzahlen, Sortieren, Grundrechenarten und Sachaufgaben.'}</p>`;
if(sh.done){html+=`<div class="notice success"><h3>🏆 Geschafft!</h3>Alle Aufgaben wurden richtig gelöst.</div>${index<2?`<button onclick="go(${index+1})">Weiter zu Arbeitsblatt ${index+2} →</button>`:'<p>Alle drei Arbeitsblätter sind geschafft! 🎉</p>'} <button class="secondary" onclick="home()">Zur Übersicht</button></div>`;$('app').innerHTML=html;return}
html+=`<div class="notice"><b>Runde ${sh.round}</b> · ${list.length} ${sh.round===1?'Aufgaben':'noch zu übende Aufgaben'}<br><span class="small">Nach der Kontrolle werden nur falsche oder unbeantwortete Aufgaben wiederholt.</span></div>`;
if(index===1){html+=`<div class="overview">${sections.map((t,i)=>`<div class="tile"><strong>${i+1}. ${t}</strong><span class="pill">${list.filter(q=>q.section===i).length} offen</span></div>`).join('')}</div><p><label for="section">Abschnitt anzeigen: </label><select id="section" onchange="setSection(this.value)"><option value="all" ${section==='all'?'selected':''}>Alle Abschnitte</option>${sections.map((t,i)=>`<option value="${i}" ${section===String(i)?'selected':''}>${i+1}. ${t}</option>`).join('')}</select></p><p class="small muted">E Einer · Z Zehner · H Hunderter · T Tausender · ZT Zehntausender · HT Hunderttausender · M Millionen · ZM Zehnmillionen · HM Hundertmillionen · Mrd Milliarden</p>`}
html+='</div>';
if(checked)html+=`<div class="card notice ${checked.wrong.length===0?'success':''}"><h3>${checked.wrong.length===0?'🎉 Alle richtig!':'Auswertung'}</h3><p>${checked.right} von ${checked.total} richtig (${Math.round(checked.right/checked.total*100)} %). ${checked.wrong.length?'Die Fehler werden in der nächsten Runde wiederholt.':'Du kannst jetzt fortfahren.'}</p><button onclick="nextRound()">${checked.wrong.length?'Nur falsche Aufgaben wiederholen →':index<2?'Nächstes Arbeitsblatt →':'Arbeitsblatt abschließen ✓'}</button></div>`;
html+=`<div class="card"><div class="questions">${visible.map(questionHTML).join('')}</div><div class="actions"><button onclick="${checked?'nextRound()':'checkAnswers()'}">${checked?checked.wrong.length?'Fehler wiederholen →':'Weiter →':'✓ Antworten überprüfen'}</button></div></div><div class="card"><details><summary><b>Lernstand und Einstellungen</b></summary><p class="small muted">Dein Lernstand wird auf diesem Gerät gespeichert.</p><button style="background:#a33434" onclick="resetAll()">Lernprogramm zurücksetzen</button></details></div>`;$('app').innerHTML=html}
window.choose=(id,v)=>{state.inputs[id]=v;save();render()};
window.pairAnswer=(id,which,v)=>{let a=(state.inputs[id]||'|').split('|');a[which]=v;state.inputs[id]=a.join('|');save()};
window.pickOrder=(id,n)=>{let a=(state.inputs[id]||'').split('|').filter(Boolean);if(!a.includes(String(n)))a.push(String(n));state.inputs[id]=a.join('|');save();render()};
window.tapLine=(ev,id)=>{if(checked)return;let rect=ev.currentTarget.getBoundingClientRect(),index=Math.max(0,Math.min(10,Math.round((ev.clientX-rect.left)/rect.width*10)));state.inputs[id]=String(index);save();render()};
window.answer=(id,value)=>{state.inputs[id]=value;save()};window.setSection=v=>{section=v;render()};window.home=()=>{page='home';checked=null;section='all';save();render();window.scrollTo({top:0,behavior:'smooth'})};window.go=i=>{state.current=i;page='sheet';checked=null;section='all';save();render();window.scrollTo({top:0,behavior:'smooth'})};window.checkAnswers=()=>{let sh=currentSheet(),qs=pending(sh);let results={},wrong=[],right=0;for(let q of qs){let ok=correct(q,state.inputs[q.id]);results[q.id]=ok;if(ok)right++;else wrong.push(q.id)}checked={results,wrong,right,total:qs.length};section='all';render();window.scrollTo({top:0,behavior:'smooth'})};window.nextRound=()=>{if(!checked)return;let sh=currentSheet();if(checked.wrong.length){sh.remaining=checked.wrong;sh.round++;for(let id of sh.remaining)delete state.inputs[id]}else{sh.done=true;sh.remaining=[];if(state.current<2)state.current++}checked=null;section='all';if(sh.done&&state.current===2)page='home';save();render();window.scrollTo({top:0,behavior:'smooth'})};window.resetAll=()=>{if(confirm('Wirklich den gesamten Lernstand löschen und neue Aufgaben erstellen?')){state=initial();checked=null;section='all';save();render()}};save();render();
</script></body></html>
