<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mathe Lernwerkstatt</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#18283b;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:20px 14px 60px}header{background:#183b72;color:white;padding:25px 18px;border-radius:18px;margin-bottom:18px}h1{margin:0 0 5px;font-size:clamp(25px,5vw,35px)}h2{font-size:23px;margin:8px 0 10px}h3{margin:0 0 8px}p{line-height:1.5}.muted{color:#627186}.card{background:white;border-radius:15px;padding:18px;margin:14px 0;box-shadow:0 3px 14px #17345a12}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab,button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;font-size:15px}button{background:#1e5cb5;color:white}button:disabled{background:#a8b1bf;cursor:not-allowed}.tab{background:#e3eaf4;color:#244365}.tab.active{background:#1e5cb5;color:white}.tab.locked{opacity:.6}.questions{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}.question{border:1px solid #dbe3ee;border-radius:12px;padding:13px;background:#fff}.question label{display:block;font-weight:650;line-height:1.45;margin-bottom:8px}.question input{width:100%;border:2px solid #cbd5e1;border-radius:9px;padding:12px;font-size:17px;background:white;color:#17283d}.question input:focus{outline:3px solid #a9caff}.question.correct{background:#e8f8ec;border-color:#51b875}.question.wrong{background:#fff0f0;border-color:#d45b5b}.hint{font-size:13px;margin-top:7px;color:#a52f2f}.progress{height:11px;background:#dce4ef;border-radius:20px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:#2a9b65;transition:width .2s}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.notice{border-left:4px solid #1e5cb5;padding:12px;background:#eaf2ff;border-radius:8px;margin:12px 0}.success{border-left-color:#239658;background:#e8f8ec}.small{font-size:13px}.overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.tile{border:1px solid #dce3ed;border-radius:12px;padding:14p 0px;color:#244565;font-size:14px;line-height:1.55}.example strong{display:block;color:#174b88;margin-bottom:3px}.example .worked{font-weight:650;color:#14365c}.example .method{font-size:13px;color:#48617c;margin-top:3px}.question .hint:empty{display:none}.example code{font-size:14px;white-space:normal}.question input{min-height:46px}

</style></head><body><main><header><h1>📘 Mathe-Lernwerkstatt</h1><div>Üben · Musterbeispiele verstehen · Fehler wiederholen</div></header><div id="app"></div><footer>Dein Lernstand wird nur in diesem Browser auf diesem Gerät gespeichert. Keine Schülerdaten werden an einen Server übertragen.</footer></main><script>
'use strict';
const KEY='mathe-lernwerkstatt-v3';const $=id=>document.getElementById(id);const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');const codes=['E','Z','H','T','ZT','HT','M','ZM','HM','Mrd'];const power=i=>10**i;const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function numberWords(n){if(n===0)return 'null';const u=['','ein','zwei','drei','vier','fünf','sechs','sieben','acht','neun'];const singles=['','eins','zwei','drei','vier','fünf','sechs','sieben','acht','neun'];const teens=['zehn','elf','zwölf','dreizehn','vierzehn','fünfzehn','sechzehn','siebzehn','achtzehn','neunzehn'];const tens=['','','zwanzig','dreißig','vierzig','fünfzig','sechzig','siebzig','achtzig','neunzig'];function under1000(x){let r='';if(x>=100){r+=u[Math.floor(x/100)]+'hundert';x%=100}if(x>=20){let t=Math.floor(x/10),z=x%10;r+=(z?u[z]+'und':'')+tens[t]}else if(x>=10)r+=teens[x-10];else if(x>0)r+=singles[x];return r}let result='';let billion=Math.floor(n/1e9);if(billion){result+=billion===1?'eine Milliarde ':under1000(billion)+' Milliarden ';n%=1e9}let million=Math.floor(n/1e6);if(million){result+=(million===1?'eine Million ':under1000(million)+' Millionen ');n%=1e6}let thousand=Math.floor(n/1000);if(thousand){result+=(thousand===1?'ein':under1000(thousand))+'tausend';n%=1000}return (result+under1000(n)).trim().replace(/\s+/g,' ')}
function makePlaceNumber(){let len=rand(2,10);let s=String(rand(1,9));for(let i=1;i<len;i++)s+=String(rand(0,9));return Number(s)}
function expanded(n){return String(n).split('').map((digit,j,arr)=>digit!=='0'?digit+codes[arr.length-j-1]:'').filter(Boolean).join(' ')}
function parseExpanded(s){let clean=s.toUpperCase().replace(/\s/g,'').replace(/MRD/g,'B');let found=[...clean.matchAll(/(\d+)(ZT|HT|ZM|HM|M|B|T|H|Z|E)/g)];if(!found.length||found.map(m=>m[0]).join('')!==clean)return null;let seen=new Set(),sum=0;for(let m of found){let code=m[2],idx=code==='B'?9:codes.indexOf(code);if(idx<0||seen.has(idx)||Number(m[1])>9)return null;seen.add(idx);sum+=Number(m[1])*power(idx)}return sum}
function makeSheet1(){let q=[];for(let a=1;a<=10;a++)for(let b=1;b<=10;b++)q.push({id:`m-${a}-${b}`,kind:'mul',prompt:`${a} × ${b} =`,answer:a*b});return shuffle(q)}
function makeSheet2(){let q=[];for(let i=0;i<12;i++){let n=makePlaceNumber();q.push({id:'p1-'+i,section:0,kind:'expanded',prompt:`${fmt(n)} =`,answer:n})}for(let i=0;i<12;i++){let n=makePlaceNumber();q.push({id:'p2-'+i,section:1,kind:'number',prompt:`${expanded(n)} =`,answer:n})}for(let i=0;i<7;i++){let n=makePlaceNumber();q.push({id:'p3-'+i,section:2,kind:'number',prompt:`${numberWords(n)}:`,answer:n})}for(let i=0;i<8;i++){let n=makePlaceNumber();let pos=shuffle([...String(n)].map((d,i)=>({d,i}))).find(x=>x.d!=='0');let digit=pos.d,place=String(n).length-pos.i-1;q.push({id:'p4-'+i,section:3,kind:'place',prompt:`Welchen Stellenwert hat die Ziffer ${digit} in ${fmt(n)}?`,answer:codes[place],numeric:power(place)*Number(digit)})}return q}
function makeSheet3(){let q=[],add=(kind,prompt,answer,extra={})=>q.push({id:'n-'+q.length,kind,prompt,answer,...extra});
// 1a: read marked number line, 1b: place points on a number line
for(let i=0;i<3;i++){let start=rand(0,5)*10,step=rand(1,4),index=rand(1,8);add('lineRead','Welche Zahl ist mit dem roten Kreuz markiert?',start+step*index,{start,step,index})}
for(let i=0;i<2;i++){let start=rand(1,5)*100,step=rand(1,4)*25,index=rand(1,8);add('lineTap',`Tippe auf dem Zahlenstrahl die Zahl ${fmt(start+step*index)} an.`,index,{start,step,index})}
// 2: comparisons
for(let i=0;i<6;i++){let a=rand(0,9999),b=i%3===0?a:rand(0,9999);add('compare',`${fmt(a)} __ ${fmt(b)}`,a===b?'=':a>b?'>':'<')}
// 3: predecessor/successor, separate fields
for(let i=0;i<4;i++){let n=rand(10,99999);add('neighbors',`Vorgänger und Nachfolger von ${fmt(n)}`,`${n-1}|${n+1}`)}
// 4: order by selecting numbers in sequence
for(let i=0;i<4;i++){let vals=new Set();while(vals.size<6)vals.add(rand(0,9999));let a=[...vals],ascending=i%2===0;add('order',`Ordne die Zahlen ${ascending?'aufsteigend (kleinste zuerst)':'absteigend (größte zuerst)'}.`,[...a].sort((x,y)=>ascending?x-y:y-x).join('|'),{options:shuffle(a)})}
// 5: column addition
for(let i=0;i<3;i++){let vals=[rand(100,999),rand(1000,9999),rand(10,99),rand(10000,99999)];add('number',`Addiere schriftlich: ${vals.map(fmt).join(' + ')} =`,vals.reduce((a,b)=>a+b,0))}
// 6: subtraction + proof
for(let i=0;i<3;i++){let a=rand(2000,9999),b=rand(100,Math.min(1999,a-1));add('number',`Berechne die Differenz: ${fmt(a)} − ${fmt(b)} =`,a-b)}
// 7: multiplication
for(let i=0;i<4;i++){let a=rand(21,999),b=rand(12,99);add('number',`${fmt(a)} × ${fmt(b)} =`,a*b)}
// 8: division no remainder and with remainder
for(let i=0;i<2;i++){let divisor=rand(3,25),quotient=rand(20,600);add('number',`${fmt(divisor*quotient)} : ${divisor} = (ohne Rest)`,quotient)}
for(let i=0;i<2;i++){let divisor=rand(3,19),quotient=rand(30,600),rem=rand(1,divisor-1);add('division',`${fmt(divisor*quotient+rem)} : ${divisor} = (mit Rest)`,`${quotient}|${rem}`)}
// 9: word problems
for(let i=0;i<3;i++){let savings=rand(9,30)*1000+rand(100,999),cost=rand(2,8)*1000+rand(100,999);add('number',`Sachaufgabe: Auf dem Sparbuch liegen ${fmt(savings)} €. Ein Fahrrad oder Fahrzeug kostet ${fmt(cost)} €. Wie viel Euro bleiben übrig?`,savings-cost)}
// 10: multiply a sum
for(let i=0;i<3;i++){let a=rand(20,150),b=rand(10,90),c=rand(3,35);add('number',`Multipliziere die Summe von ${a} und ${b} mit ${c}.`,(a+b)*c)}
return q}
function initial(){return {version:3,sheets:[{questions:makeSheet1(),remaining:null,round:1,done:false,history:[]},{questions:makeSheet2(),remaining:null,round:1,done:false,history:[]},{questions:makeSheet3(),remaining:null,round:1,done:false,history:[]}],current:0,inputs:{}}}let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||state.version!==3||!Array.isArray(state.sheets)||state.sheets.length!==3){let old;try{old=JSON.parse(localStorage.getItem('mathe-lernwerkstatt-v2'))}catch{}state=initial();if(old&&old.version===2&&old.sheets?.length===2){state.sheets[0]=old.sheets[0];state.sheets[1]=old.sheets[1];state.current=old.current;state.inputs=old.inputs||{}}}let checked=null,section='all',page='home',review={};function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}function currentSheet(){return state.sheets[state.current]}function pending(sh){return sh.remaining===null?sh.questions:sh.questions.filter(q=>sh.remaining.includes(q.id))}function normalize(s){return String(s??'').trim().toLowerCase().replace(/[.\s]/g,'').replace(/ß/g,'ss')}
function correct(q,v){let x=normalize(v);if(!x)return false;if(q.kind==='lineTap')return Number(x)===q.answer;if(q.kind==='compare')return x===q.answer;if(q.kind==='order'||q.kind==='neighbors'||q.kind==='division')return x===normalize(q.answer);if(q.kind==='expanded')return parseExpanded(v)===q.answer;if(q.kind==='place'){if(x===normalize(q.answer))return true;let names={E:['e','einer','einerstelle'],Z:['z','zehner','zehnerstelle'],H:['h','hunderter','hunderterstelle'],T:['t','tausender','tausenderstelle'],ZT:['zt','zehntausender'],HT:['ht','hunderttausender'],M:['m','million','millionen'],ZM:['zm','zehnmillionen'],HM:['hm','hundertmillionen'],Mrd:['mrd','milliarde','milliarden']};return names[q.answer].includes(x)||Number(x)===q.numeric}return /^\d+$/.test(x)&&Number(x)===q.answer}
// Ein Musterbeispiel pro Aufgabenart, nicht pro Rechnung.
function workedExample(q){
 const show=(task,solution,method)=>`<div class="example"><strong>💡 So geht’s – Beispiel</strong><div>${safe(task)}</div><div class="worked">${safe(solution)}</div><div class="method">${safe(method)}</div></div>`;
 if(q.kind==='mul')return show('6 × 7 = ?', '6 × 7 = 42','Multipliziere die beiden Zahlen und schreibe nur das Ergebnis.');
 if(q.kind==='expanded')return show('4 305 in Stellenwerte zerlegen','4 305 = 4T 3H 5E','T = Tausender, H = Hunderter, Z = Zehner, E = Einer. Nullstellen kannst du weglassen.');
 if(q.kind==='place')return show('Welche Stelle hat die 5 in 25 798?','5T (Tausender)','Zähle die Stellen von rechts: E, Z, H, T, ZT.');
 if(q.section===1)return show('4T 3H 5E als Zahl','4 305','Die Ziffern stehen an den angegebenen Stellen. Fehlende Stellen erhalten eine Null.');
 if(q.section===2)return show('Dreitausendvierhundertzwölf','3 412','Schreibe das Zahlwort als Ziffernzahl.');
 if(q.kind==='lineRead')return show('Start 0, Schrittweite 2, Kreuz am dritten Strich nach 0','6','Zähle die Abstände auf dem Zahlenstrahl.');
 if(q.kind==='lineTap')return show('Start 100, Schrittweite 50: Wo liegt 250?','Beim dritten Schritt nach 100','Tippe auf den passenden Strich.');
 if(q.kind==='compare')return show('84 __ 48','84 > 48','Die Spitze zeigt auf die kleinere Zahl.');
 if(q.kind==='neighbors')return show('Vorgänger und Nachfolger von 200','199 | 201','Vorgänger: minus 1; Nachfolger: plus 1.');
 if(q.kind==='order')return show('3, 9, 1 aufsteigend sortieren','1 → 3 → 9','Tippe die Zahlen in der verlangten Reihenfolge an.');
 if(q.kind==='division')return show('17 : 5','3 Rest 2','5 × 3 = 15; 17 − 15 = 2. Ergebnis und Rest getrennt eintragen.');
 if(q.prompt.includes('Addiere'))return show('205 + 37','242','Schreibe Einer unter Einer und Zehner unter Zehner.');
 if(q.prompt.includes('Differenz'))return show('81 − 27','54','Subtrahiere die kleinere Zahl von der größeren.');
 if(q.prompt.includes('Sachaufgabe'))return show('Auf dem Sparbuch sind 100 €. Ein Buch kostet 35 €.','100 − 35 = 65 €','Ziehe den Kaufpreis vom vorhandenen Geld ab.');
 if(q.prompt.includes('Summe'))return show('Multipliziere die Summe von 5 und 3 mit 4','(5 + 3) × 4 = 32','Berechne zuerst die Summe in der Klammer.');
 if(q.prompt.includes('×'))return show('24 × 3','72','Multipliziere die Faktoren miteinander.');
 if(q.prompt.includes(':'))return show('48 : 6','8','Teile die erste Zahl durch die zweite.');
 return show('36 + 27','63','Rechne die Aufgabe Schritt für Schritt und trage das Ergebnis ein.');
}
const sections=['Stellenwerte aufschreiben','Als Zahl schreiben','Zahlwörter umwandeln','Stellenwert erkennen'];
function questionHTML(q,i){let v=state.inputs[q.id]||'',r=review[q.id],klass=r===true?'correct':r===false?'wrong':'';let body='',locked=r===true;
if(q.kind==='lineRead'||q.kind==='lineTap'){
// SVG uses a fixed coordinate system, so ticks, labels and touch targets always align.
const tickX=j=>30+j*54;
const ticks=Array.from({length:11},(_,j)=>`<line x1="${tickX(j)}" y1="29" x2="${tickX(j)}" y2="49" stroke="#315d91" stroke-width="2"/><text x="${tickX(j)}" y="70" text-anchor="middle" font-size="${String(q.start+j*q.step).length>5?12:14}" fill="#263d59">${j===0||j===5||j===10?fmt(q.start+j*q.step):''}</text>`).join('');
const point=q.kind==='lineRead'?`<text x="${tickX(q.index)}" y="23" text-anchor="middle" font-size="29" font-weight="bold" fill="#c13e3e">×</text>`:v!==''?`<circle cx="${tickX(Number(v))}" cy="39" r="8" fill="#c13e3e" stroke="white" stroke-width="2"/>`:'';
const targets=q.kind==='lineTap'?Array.from({length:11},(_,j)=>`<rect x="${tickX(j)-25}" y="7" width="50" height="75" fill="transparent" role="button" tabindex="0" aria-label="${fmt(q.start+j*q.step)} auswählen" onclick="choose('${q.id}','${j}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();choose('${q.id}','${j}')}"/>`).join(''):'';
body=`<div class="numberline" style="height:auto;margin:12px 0"><svg viewBox="0 0 600 90" width="100%" style="display:block;max-width:100%;overflow:visible;touch-action:manipulation" aria-label="Zahlenstrahl von ${fmt(q.start)} bis ${fmt(q.start+10*q.step)}" role="img"><line x1="30" y1="39" x2="583" y2="39" stroke="#315d91" stroke-width="3"/><path d="M 573 31 L 584 39 L 573 47" fill="none" stroke="#315d91" stroke-width="3"/>${ticks}${point}${targets}</svg></div>`;
if(q.kind==='lineRead')body+=`<input type="text" inputmode="numeric" value="${safe(v)}" ${locked?'disabled':''} oninput="answer('${q.id}',this.value)" placeholder="Zahl eingeben">`;
else body+=`<div class="answer-note">${v!==''?'Gewählter Punkt: '+fmt(q.start+Number(v)*q.step):'Tippe auf einen Strich des Zahlenstrahls'}</div>`;
}else if(q.kind==='compare'){body=`<div class="choices">${['<','=','>'].map(op=>`<button class="choice ${v===op?'selected':''}" ${locked?'disabled':''} onclick="choose('${q.id}','${safe(op)}')">${op==='<'?'&lt;':op==='>'?'&gt;':'='}</button>`).join('')}</div>`}
else if(q.kind==='neighbors'||q.kind==='division'){let a=v.split('|');body=`<div class="questions"><div><label>${q.kind==='neighbors'?'Vorgänger':'Ergebnis'}</label><input inputmode="numeric" value="${safe(a[0]||'')}" ${locked?'disabled':''} oninput="pairAnswer('${q.id}',0,this.value)"></div><div><label>${q.kind==='neighbors'?'Nachfolger':'Rest'}</label><input inputmode="numeric" value="${safe(a[1]||'')}" ${locked?'disabled':''} oninput="pairAnswer('${q.id}',1,this.value)"></div></div>`}
else if(q.kind==='order'){let selected=v?v.split('|').filter(Boolean):[];body=`<div class="choices">${q.options.map(n=>`<button class="choice ${selected.includes(String(n))?'selected':''}" ${locked||selected.includes(String(n))?'disabled':''} onclick="pickOrder('${q.id}',${n})">${fmt(n)}</button>`).join('')}</div><div class="answer-note">Deine Reihenfolge: ${selected.length?selected.map(fmt).join(' → '):'Tippe die Zahlen der Reihe nach an'}</div>${!locked?`<button class="secondary" onclick="choose('${q.id}','')">Reihenfolge löschen</button>`:''}`}
else body=`<input type="text" inputmode="${q.kind==='expanded'||q.kind==='place'?'text':'numeric'}" autocomplete="off" autocapitalize="off" spellcheck="false" value="${safe(v)}" ${locked?'disabled':''} oninput="answer('${q.id}',this.value)" placeholder="Hier deine Lösung eingeben">`;
return `<div class="question ${klass} ${['lineRead','lineTap','order'].includes(q.kind)?'wide':''}"><label>${i+1}. ${safe(q.prompt)}</label><div class="input-action-row ${['lineRead','lineTap'].includes(q.kind)?'numberline-layout':''}">${body}<div class="${['lineRead','lineTap'].includes(q.kind)?'numberline-buttons':'inline-buttons'}"><button type="button" onclick="checkOne('${q.id}')">✓ Prüfen</button><button type="button" class="retry" onclick="retryOne('${q.id}')" title="Antwort löschen und neu eingeben">↻ Neu</button></div></div><div class="question-actions"><span class="hint ${r===true?'good':r===false?'bad':''}">${r===true?'✓ Richtig!':r===false?'✗ Noch nicht richtig – verbessere deine Antwort.':'Noch nicht kontrolliert'}</span></div></div>`}
const titles=['Das kleine Einmaleins','Stellenwerte natürlicher Zahlen','Natürliche Zahlen – Wiederholung'];
const descriptions=['100 gemischte Multiplikationsaufgaben von 1 bis 10','Zahlen zerlegen, Stellenwerte, Zahlwörter und Ziffernpositionen','Zahlenstrahl, Vergleiche, Nachbarzahlen, Sortieren, Rechnen und Sachaufgaben'];
function renderHome(){let completed=state.sheets.filter(s=>s.done).length;let html=`<section class="card home-intro"><h2>Wähle dein Arbeitsblatt</h2><p class="muted">Du kannst jedes Arbeitsblatt direkt öffnen. Jede Aufgabenart wird einmal mit einem Musterbeispiel erklärt. Jede Rechnung hat eigene Buttons zum Prüfen und Neueingeben. Falsche Aufgaben werden wiederholt, bis du alle richtig hast.</p><div class="progress" aria-label="${completed} von 3 Arbeitsblättern abgeschlossen"><div style="width:${completed/3*100}%"></div></div><p class="small muted">${completed} von 3 Arbeitsblättern abgeschlossen</p></section><div class="sheet-list">`;
state.sheets.forEach((sh,i)=>{let remaining=pending(sh).length;let status=sh.done?'✓ Abgeschlossen':sh.round>1?'In Bearbeitung · Runde '+sh.round+' · '+remaining+' offen':'Noch nicht abgeschlossen';html+=`<button class="sheet-card" onclick="go(${i})" aria-label="Arbeitsblatt ${i+1}: ${safe(titles[i])} öffnen"><span class="sheet-number">${i+1}</span><span class="sheet-copy"><span class="sheet-kicker">ARBEITSBLATT ${i+1}</span><strong>${safe(titles[i])}</strong><span class="sheet-description">${safe(descriptions[i])}</span><span class="sheet-status ${sh.done?'completed':''}">${status}</span></span><span class="sheet-chevron">›</span></button>`});html+=`</div><div class="card"><details><summary><b>Lernstand und Einstellungen</b></summary><p class="small muted">Dein Lernstand wird nur in diesem Browser gespeichert.</p><button style="background:#a33434" onclick="resetAll()">Lernprogramm zurücksetzen</button></details></div>`;$('app').innerHTML=html}
function render(){if(page==='home'){renderHome();return}let sh=currentSheet(),list=pending(sh),index=state.current,isFirst=index===0,visible=index===1&&section!=='all'?list.filter(q=>q.section===Number(section)):list,count=state.sheets.filter(x=>x.done).length;
let html=`<div class="nav-bar"><button class="secondary" onclick="home()">← Zur Übersicht</button><span class="small muted">Arbeitsblatt ${index+1} von 3</span></div>`;
html+=`<div class="card"><h2>Arbeitsblatt ${index+1}: ${titles[index]}</h2><p class="muted">${index===0?'100 gemischte Malaufgaben.':index===1?'Vier Aufgabentypen mit eigenen Zahlen.':'Zahlenstrahl, Vergleiche, Nachbarzahlen, Sortieren, Grundrechenarten und Sachaufgaben.'}</p>`;
if(sh.done){html+=`<div class="notice success"><h3>🏆 Geschafft!</h3>Alle Aufgaben wurden richtig gelöst.</div>${index<2?`<button onclick="go(${index+1})">Weiter zu Arbeitsblatt ${index+2} →</button>`:'<p>Alle drei Arbeitsblätter sind geschafft! 🎉</p>'} <button class="secondary" onclick="home()">Zur Übersicht</button></div>`;$('app').innerHTML=html;return}
html+=`<div class="notice"><b>Runde ${sh.round}</b> · ${list.length} ${sh.round===1?'Aufgaben':'noch zu übende Aufgaben'}<br><span class="small">Nach der Kontrolle werden nur falsche oder unbeantwortete Aufgaben wiederholt.</span></div>`;
if(index===1){html+=`<div class="overview">${sections.map((t,i)=>`<div class="tile"><strong>${i+1}. ${t}</strong><span class="pill">${list.filter(q=>q.section===i).length} offen</span></div>`).join('')}</div><p><label for="section">Abschnitt anzeigen: </label><select id="section" onchange="setSection(this.value)"><option value="all" ${section==='all'?'selected':''}>Alle Abschnitte</option>${sections.map((t,i)=>`<option value="${i}" ${section===String(i)?'selected':''}>${i+1}. ${t}</option>`).join('')}</select></p><p class="small muted">E Einer · Z Zehner · H Hunderter · T Tausender · ZT Zehntausender · HT Hunderttausender · M Millionen · ZM Zehnmillionen · HM Hundertmillionen · Mrd Milliarden</p>`}
html+='</div>';
let allChecked=list.every(q=>review[q.id]!==undefined),right=list.filter(q=>review[q.id]===true).length;
html+=`<div class="card notice ${allChecked&&right===list.length?'success':''}"><h3>Dein Fortschritt</h3><p>${right} von ${list.length} richtig · ${list.filter(q=>review[q.id]!==undefined).length} kontrolliert. Du kannst jede Aufgabe direkt neben der Eingabe überprüfen und bei Bedarf verbessern.</p>${allChecked&&right===list.length?`<button onclick="finishRound()">${index<2?'Arbeitsblatt abschließen und weiter →':'Arbeitsblatt abschließen ✓'}</button>`:''}</div>`;
function exampleGroup(q){if(index===0)return 'Einmaleins';if(index===1)return 's2-'+q.section;if(q.kind==='number'){let p=q.prompt;return p.startsWith('Addiere')?'Addition':p.startsWith('Berechne die Differenz')?'Subtraktion':p.includes(' × ')?'Multiplikation':p.includes(' : ')?'Division ohne Rest':p.startsWith('Sachaufgabe')?'Sachaufgabe':'Summe multiplizieren'}return q.kind}
let shownGroups=new Set();let questionsHTML='';for(let i=0;i<visible.length;i++){let q=visible[i],group=exampleGroup(q);if(!shownGroups.has(group)){shownGroups.add(group);questionsHTML+=`<div class="group-example"><h3>💡 Musterbeispiel: ${safe(index===0?'Einmaleins':index===1?sections[q.section]:({'lineRead':'Zahl am Zahlenstrahl ablesen','lineTap':'Zahl am Zahlenstrahl markieren','compare':'Zahlen vergleichen','neighbors':'Vorgänger und Nachfolger','order':'Zahlen sortieren','Addition':'Schriftlich addieren','Subtraktion':'Subtrahieren','Multiplikation':'Multiplizieren','Division ohne Rest':'Dividieren','division':'Division mit Rest','Sachaufgabe':'Sachaufgabe','Summe multiplizieren':'Summe multiplizieren'})[group]||group)}</h3>${workedExample(q)}</div>`;}questionsHTML+=questionHTML(q,i)}
html+=`<div class="card"><div class="questions">${questionsHTML}</div><div class="actions"><button class="secondary" onclick="home()">← Zur Übersicht</button></div></div><div class="card"><details><summary><b>Lernstand und Einstellungen</b></summary><p class="small muted">Dein Lernstand wird auf diesem Gerät gespeichert.</p><button style="background:#a33434" onclick="resetAll()">Lernprogramm zurücksetzen</button></details></div>`;$('app').innerHTML=html}
window.choose=(id,v)=>{state.inputs[id]=v;delete review[id];save();render()};
window.pairAnswer=(id,which,v)=>{let a=(state.inputs[id]||'|').split('|');a[which]=v;state.inputs[id]=a.join('|');delete review[id];save()};
window.pickOrder=(id,n)=>{let a=(state.inputs[id]||'').split('|').filter(Boolean);if(!a.includes(String(n)))a.push(String(n));state.inputs[id]=a.join('|');delete review[id];save();render()};
window.tapLine=(ev,id)=>{if(review[id]===true)return;let rect=ev.currentTarget.getBoundingClientRect(),index=Math.max(0,Math.min(10,Math.round((ev.clientX-rect.left)/rect.width*10)));state.inputs[id]=String(index);delete review[id];save();render()};
window.answer=(id,value)=>{state.inputs[id]=value;delete review[id];save()};
window.retryOne=id=>{state.inputs[id]='';delete review[id];save();render();const el=[...document.querySelectorAll('.question')].find(e=>e.querySelector(`button[onclick="checkOne('${id}')"]`));el?.querySelector('input:not([disabled])')?.focus();el?.scrollIntoView({block:'nearest'});};
window.checkOne=id=>{let q=pending(currentSheet()).find(x=>x.id===id);if(!q)return;let value=state.inputs[id];if(value===undefined||String(value).trim()===''||value==='|'){alert('Bitte zuerst eine Antwort eingeben.');return}review[id]=correct(q,value);render();let el=[...document.querySelectorAll('.question')].find(e=>e.querySelector(`button[onclick="checkOne('${id}')"]`));if(el)el.scrollIntoView({block:'nearest'});};
window.setSection=v=>{section=v;render()};
window.home=()=>{page='home';checked=null;section='all';save();render();window.scrollTo({top:0,behavior:'smooth'})};
window.go=i=>{if(state.current!==i)review={};state.current=i;page='sheet';checked=null;section='all';save();render();window.scrollTo({top:0,behavior:'smooth'})};
window.finishRound=()=>{let sh=currentSheet(),qs=pending(sh);if(!qs.every(q=>review[q.id]===true))return;sh.done=true;sh.remaining=[];review={};if(state.current<2)state.current++;page='home';section='all';save();render();window.scrollTo({top:0,behavior:'smooth'})};
window.resetAll=()=>{if(confirm('Wirklich den gesamten Lernstand löschen und neue Aufgaben erstellen?')){state=initial();review={};checked=null;section='all';save();render()}};
save();render();
</script></body></html>
