'use strict';
const KEY='mathe-lernwerkstatt-v3';const $=id=>document.getElementById(id);const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');const codes=['E','Z','H','T','ZT','HT','M','ZM','HM','Mrd'];const power=i=>10**i;const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function numberWords(n){if(n===0)return 'null';const u=['','ein','zwei','drei','vier','fünf','sechs','sieben','acht','neun'];const singles=['','eins','zwei','drei','vier','fünf','sechs','sieben','acht','neun'];const teens=['zehn','elf','zwölf','dreizehn','vierzehn','fünfzehn','sechzehn','siebzehn','achtzehn','neunzehn'];const tens=['','','zwanzig','dreißig','vierzig','fünfzig','sechzig','siebzig','achtzig','neunzig'];function under1000(x){let r='';if(x>=100){r+=u[Math.floor(x/100)]+'hundert';x%=100}if(x>=20){let t=Math.floor(x/10),z=x%10;r+=(z?u[z]+'und':'')+tens[t]}else if(x>=10)r+=teens[x-10];else if(x>0)r+=singles[x];return r}let result='';let billion=Math.floor(n/1e9);if(billion){result+=billion===1?'eine Milliarde ':under1000(billion)+' Milliarden ';n%=1e9}let million=Math.floor(n/1e6);if(million){result+=(million===1?'eine Million ':under1000(million)+' Millionen ');n%=1e6}let thousand=Math.floor(n/1000);if(thousand){result+=(thousand===1?'ein':under1000(thousand))+'tausend';n%=1000}return (result+under1000(n)).trim().replace(/\s+/g,' ')}
function makePlaceNumber(){let len=rand(2,10);let s=String(rand(1,9));for(let i=1;i<len;i++)s+=String(rand(0,9));return Number(s)}
function expanded(n){return String(n).split('').map((digit,j,arr)=>digit!=='0'?digit+codes[arr.length-j-1]:'').filter(Boolean).join(' ')}
function parseExpanded(s){let clean=s.toUpperCase().replace(/\s/g,'').replace(/MRD/g,'B');let found=[...clean.matchAll(/(\d+)(ZT|HT|ZM|HM|M|B|T|H|Z|E)/g)];if(!found.length||found.map(m=>m[0]).join('')!==clean)return null;let seen=new Set(),sum=0;for(let m of found){let code=m[2],idx=code==='B'?9:codes.indexOf(code);if(idx<0||seen.has(idx)||Number(m[1])>9)return null;seen.add(idx);sum+=Number(m[1])*power(idx)}return sum}
function makeSheet1(){let q=[];for(let a=1;a<=10;a++)for(let b=1;b<=10;b++)q.push({id:`m-${a}-${b}`,kind:'mul',prompt:`${a} × ${b} =`,answer:a*b});return shuffle(q)}
function makeSheet2(){let q=[];for(let i=0;i<12;i++){let n=makePlaceNumber();q.push({id:'p1-'+i,section:0,kind:'expanded',prompt:`${fmt(n)} =`,answer:n})}for(let i=0;i<12;i++){let n=makePlaceNumber();q.push({id:'p2-'+i,section:1,kind:'number',prompt:`${expanded(n)} =`,answer:n})}for(let i=0;i<7;i++){let n=makePlaceNumber();q.push({id:'p3-'+i,section:2,kind:'number',prompt:`${numberWords(n)}:`,answer:n})}for(let i=0;i<8;i++){let n=makePlaceNumber();let pos=shuffle([...String(n)].map((d,i)=>({d,i}))).find(x=>x.d!=='0');let digit=pos.d,place=String(n).length-pos.i-1;q.push({id:'p4-'+i,section:3,kind:'place',prompt:`Welchen Stellenwert hat die Ziffer ${digit} in ${fmt(n)}?`,answer:codes[place],numeric:power(place)*Number(digit)})}return q}
function makeSheet3(){let q=[],add=(kind,prompt,answer,extra={})=>q.push({id:'n-'+q.length,kind,prompt,answer,...extra});
// 1a: read marked number line, 1b: place points on a number line
for(let i=0;i<3;i++){let start=rand(0,5)*10,step=rand(1,4),index=rand(1,8);add('lineRead','Welche Zahl ist mit dem roten Kreuz markiert?',start+step*index,{start,step,index})}
for(let i=0;i<2;i++){let start=rand(1,5)*100,step=rand(1,4)*25,index=rand(1,8);add('lineTap',`Tippe auf dem Zahlenstrahl die Zahl ${fmt(start+step*index)} an.`,index,{start,step,index})}
// 2: comparisons
for(let i=0;i<6;i++){let a=rand(0,9999),b=i%3===0?a:rand(0,9999);add('compare',`${fmt(a)} __ ${fmt(b)}`,a===b?'=':a>b?'>':'<')}
// 3: predecessor/successor, separate fields
for(let i=0;i<4;i++){let n=rand(10,99999);add('neighbors',`Vorgänger und Nachfolger von ${fmt(n)}`,`${n-1}|${n+1}`)}
// 4: order by selecting numbers in sequence
for(let i=0;i<4;i++){let vals=new Set();while(vals.size<6)vals.add(rand(0,9999));let a=[...vals],ascending=i%2===0;add('order',`Ordne die Zahlen ${ascending?'aufsteigend (kleinste zuerst)':'absteigend (größte zuerst)'}.`,[...a].sort((x,y)=>ascending?x-y:y-x).join('|'),{options:shuffle(a)})}
// 5: column addition
for(let i=0;i<3;i++){let vals=[rand(100,999),rand(1000,9999),rand(10,99),rand(10000,99999)];add('number',`Addiere schriftlich: ${vals.map(fmt).join(' + ')} =`,vals.reduce((a,b)=>a+b,0))}
// 6: subtraction + proof
for(let i=0;i<3;i++){let a=rand(2000,9999),b=rand(100,Math.min(1999,a-1));add('number',`Berechne die Differenz: ${fmt(a)} − ${fmt(b)} =`,a-b)}
// 7: multiplication
for(let i=0;i<4;i++){let a=rand(21,999),b=rand(12,99);add('number',`${fmt(a)} × ${fmt(b)} =`,a*b)}
// 8: division no remainder and with remainder
for(let i=0;i<2;i++){let divisor=rand(3,25),quotient=rand(20,600);add('number',`${fmt(divisor*quotient)} : ${divisor} = (ohne Rest)`,quotient)}
for(let i=0;i<2;i++){let divisor=rand(3,19),quotient=rand(30,600),rem=rand(1,divisor-1);add('division',`${fmt(divisor*quotient+rem)} : ${divisor} = (mit Rest)`,`${quotient}|${rem}`)}
// 9: word problems
for(let i=0;i<3;i++){let savings=rand(9,30)*1000+rand(100,999),cost=rand(2,8)*1000+rand(100,999);add('number',`Sachaufgabe: Auf dem Sparbuch liegen ${fmt(savings)} €. Ein Fahrrad oder Fahrzeug kostet ${fmt(cost)} €. Wie viel Euro bleiben übrig?`,savings-cost)}
// 10: multiply a sum
for(let i=0;i<3;i++){let a=rand(20,150),b=rand(10,90),c=rand(3,35);add('number',`Multipliziere die Summe von ${a} und ${b} mit ${c}.`,(a+b)*c)}
return q}

function makeSheet4(){
 const q=[],add=(section,kind,prompt,answer,extra={})=>q.push({id:'v4-'+q.length,section,kind,prompt,answer,...extra});
 // 1. Sachaufgaben zum Quadratmeterpreis
 for(let i=0;i<3;i++){const qm=rand(55,125),rate=rand(12,48)*10,preis=qm*rate;add(0,'number',`Eine Wohnung mit ${qm} m² kostet ${fmt(preis)} €. Wie hoch ist der Preis pro Quadratmeter (in €)?`,preis/qm,{displayAnswer:preis/qm});}
 // 2. Namen der Abkürzungen
 [['T','Tausender'],['ZT','Zehntausender'],['HT','Hunderttausender'],['Mio','Millionen'],['ZMio','Zehnmillionen'],['HMio','Hundertmillionen']].forEach(([code,name])=>add(1,'word',`Wofür steht ${code}?`,name));
 // 3. Zahl in Stellenwerttabelle: jede Ziffer einzeln
 for(let i=0;i<5;i++){const n=rand(100,9999999);add(2,'digitGrid',`Trage ${fmt(n)} in die Stellenwerttabelle ein.`,n);}
 // 4. Stellenwerttabelle lesen
 for(let i=0;i<5;i++){const n=rand(100,9999999);add(3,'gridRead','Welche Zahl steht in der Stellenwerttabelle?',n);}
 // 5. Zahlwörter in Ziffern
 for(let i=0;i<6;i++){const n=rand(1000,999999);add(4,'number',`${numberWords(n)} =`,n);}
 // 6. Zahlen in Worten
 for(let i=0;i<4;i++){const n=rand(1000,999999);add(5,'word',`Schreibe ${fmt(n)} in Worten.`,numberWords(n));}
 return q;
}
function gridTable(n,editable,id,locked=false){
 const digits=String(n).padStart(7,'0').split('');
 const v=(state.inputs[id]||'').split('|');
 const labels=['Mio','HT','ZT','T','H','Z','E'];
 return `<div class="place-grid" role="group" aria-label="Stellenwerttabelle">
 ${labels.map((label,i)=>`<div class="place-col"><span>${label}</span>${editable?`<input type="text" inputmode="numeric" maxlength="1" aria-label="${label}" value="${safe(v[i]||'')}" ${locked?'disabled':''} oninput="gridAnswer('${id}',${i},this.value)" />`:`<b>${digits[i]}</b>`}</div>`).join('')}</div>`;
}


// Arbeitsblätter 5–14: nach den zehn fotografierten Vorlagen, mit neuen Zahlen.
const extraTitles=['Große Zahlen und Stellenwerttabellen','Zahlenstrahl – Ablesen und Markieren','Zahlenstrahl – A, B, C und D','Runden – Grundlagen','Runden – gemischte Übungen','Addition in der Zeile','Grundrechenarten – Fachbegriffe','Rechengesetze – geschickt rechnen','Subtraktion in der Zeile','Terme und Rechengesetze'];
const extraDescriptions=['Große Zahlen bis Billionen und Tabellen','Schrittweiten erkennen, Punkte ablesen und setzen','Vier markierte Zahlen je Zahlenstrahl bestimmen','Auf Zehner bis Hunderttausender runden','Unterstrichene Stellenwerte und Sachaufgaben','Mehrere Summanden sicher addieren','Fachbegriffe als Texteingaben und Terme (kein Kreuzworträtsel)','Summanden vorteilhaft zusammenfassen','Große Zahlen subtrahieren','Klammern, Vertauschen und Verbindungen nutzen'];
const bigCodes=['E','Z','H','T','ZT','HT','Mio','ZMio','HMio','Mrd','ZMrd','HMrd','Bio','ZBio','HBio'];
const bigNames=['Einer','Zehner','Hunderter','Tausender','Zehntausender','Hunderttausender','Millionen','Zehnmillionen','Hundertmillionen','Milliarden','Zehnmilliarden','Hundertmilliarden','Billionen','Zehnbillionen','Hundertbillionen'];
function extraQ(sheet){let qs=[];const add=(kind,prompt,answer,extra={})=>qs.push({id:`x${sheet}-${qs.length}`,kind,prompt,answer,...extra});
const r=(a,b)=>rand(a,b),f=n=>fmt(n);
if(sheet===5){
 add('number','Ein Satellit ist 151 000 000 km entfernt, ein anderer 410 000 km. Wie groß ist der Unterschied in km?',150590000,{group:'Entfernungen'});
 for(let i=0;i<9;i++){let n=[r(1000,99999),r(100000,9999999),r(10000000,999999999),r(1000000000,9999999999),r(10000000000,999999999999),r(1000000000000,9999999999999)][i%6];add('bigWrite',`Trage ${f(n)} in die Stellenwerttabelle ein.`,n,{group:'Große Zahlen eintragen'});}
 for(let i=0;i<6;i++){let n=[r(1000,999999),r(1000000,999999999),r(1000000000,9999999999),r(10000000000,999999999999),r(1000000000000,9999999999999),r(10000000,999999999)][i];add('bigRead','Lies die Stellenwerttabelle und schreibe die Zahl.',n,{group:'Große Zahlen ablesen'});}
 const words=[['vierzehn Milliarden',14000000000],['sechs Millionen',6000000],['450 Millionen',450000000],['neunzig Milliarden',90000000000],['drei Billionen',3000000000000],['zweihundertsechsundachtzig Billionen',286000000000000],['eine halbe Million',500000],['tausend Millionen',1000000000]];
 words.forEach(([w,n])=>add('number',`${w} =`,n,{group:'Große Zahlwörter'}));
}
if(sheet===6){for(let i=0;i<10;i++){let step=[1,2,5,10,20,50,100][i%7],start=[0,10,100,200][i%4],idx=r(1,9);add('lineRead',`Lies die markierte Zahl ab. Schrittweite: ${step}.`,start+idx*step,{start,step,index:idx,group:'Zahlen ablesen'});}
for(let i=0;i<8;i++){let step=[1,2,5,10,20,50][i%6],start=[0,20,100][i%3],idx=r(1,9);add('lineTap',`Markiere ${f(start+idx*step)} auf dem Zahlenstrahl.`,idx,{start,step,group:'Zahlen markieren'});}}
if(sheet===7){for(let j=0;j<8;j++){let start=[0,20,40,50,80][j%5],step=[1,2,5][j%3],pos=shuffle([r(1,2),r(3,4),r(5,6),r(7,9)]);for(let k=0;k<4;k++)add('lineRead',`Zahlenstrahl ${j+1}: Welche Zahl hat Punkt ${'ABCD'[k]}?`,start+pos[k]*step,{start,step,index:pos[k],pointLabel:'ABCD'[k],group:`Zahlenstrahl ${j+1}: A–D`});}}
if(sheet===8){for(let i=0;i<30;i++){let places=[10,100,1000,10000,100000],place=places[Math.floor(i/6)],n=r(120000,980000);add('number',`Runde ${f(n)} auf ${['Zehner','Hunderter','Tausender','Zehntausender','Hunderttausender'][Math.floor(i/6)]}.`,Math.round(n/place)*place,{group:`Auf ${['Zehner','Hunderter','Tausender','Zehntausender','Hunderttausender'][Math.floor(i/6)]} runden`,roundTo:place});}}
if(sheet===9){for(let i=0;i<15;i++){let place=[10,100,1000][i%3],n=r(2000,99999);add('number',`Runde ${f(n)} auf ${place===10?'Zehner':place===100?'Hunderter':'Tausender'}.`,Math.round(n/place)*place,{group:'Stellenwert runden',roundTo:place});}
for(let i=0;i<8;i++){let n=r(1000,999999),place=[10,100,1000,10000][i%4];add('number',`Runde ${f(n)} auf die ${bigNames[Math.log10(place)]}-Stelle.`,Math.round(n/place)*place,{group:'Auf die angegebene Stelle runden',roundTo:place});}

let html=`<div class="nav-bar"><button class="secondary" onclick="home()">← Zur Übersicht</button><span class="small muted">Arbeitsblatt ${index+1} von 14</span></div>`;
html+=`<div class="card"><h2>Arbeitsblatt ${index+1}: ${titles[index]}</h2><p class="muted">${index===0?'100 gemischte Malaufgaben.':index===1?'Vier Aufgabentypen mit eigenen Zahlen.':index===2?'Zahlenstrahl, Vergleiche, Nachbarzahlen, Sortieren, Grundrechenarten und Sachaufgaben.':index===3?'Sechs Aufgabenarten nach deiner neuen Vorlage.':extraDescriptions[index-4]}</p>`;
if(sh.done){html+=`<div class="notice success"><h3>🏆 Geschafft!</h3>Alle Aufgaben wurden richtig gelöst.</div>${index<13?`<button onclick="go(${index+1})">Weiter zu Arbeitsblatt ${index+2} →</button>`:'<p>Alle vierzehn Arbeitsblätter sind geschafft! 🎉</p>'} <button class="secondary" onclick="home()">Zur Übersicht</button></div>`;$('app').innerHTML=html;return}
html+=`<div class="notice"><b>Runde ${sh.round}</b> · ${list.length} ${sh.round===1?'Aufgaben':'noch zu übende Aufgaben'}<br><span class="small">Prüfe jede Aufgabe einzeln. Falsche Antworten kannst du mit „Neu“ verbessern; erst wenn alle richtig sind, ist das Blatt abgeschlossen.</span></div>`;
if(index===1||index===3||index>=4){let sectionNames=index>=4?[...new Set(sh.questions.map(q=>q.group))]:index===3?sections4:sections;html+=`<div class="overview">${sectionNames.map((t,i)=>`<div class="tile"><strong>${i+1}. ${t}</strong><span class="pill">${list.filter(q=>index>=4?q.group===t:q.section===i).length} offen</span></div>`).join('')}</div><p><label for="section">Abschnitt anzeigen: </label><select id="section" onchange="setSection(this.value)"><option value="all" ${section==='all'?'selected':''}>Alle Abschnitte</option>${sectionNames.map((t,i)=>`<option value="${i}" ${section===String(i)?'selected':''}>${i+1}. ${t}</option>`).join('')}</select></p><p class="small muted">E Einer · Z Zehner · H Hunderter · T Tausender · ZT Zehntausender · HT Hunderttausender · M Millionen · ZM Zehnmillionen · HM Hundertmillionen · Mrd Milliarden</p>`}
html+='</div>';
let allChecked=list.every(q=>review[q.id]!==undefined),right=list.filter(q=>review[q.id]===true).length;
html+=`<div class="card notice ${allChecked&&right===list.length?'success':''}"><h3>Dein Fortschritt</h3><p>${right} von ${list.length} richtig · ${list.filter(q=>review[q.id]!==undefined).length} kontrolliert. Du kannst jede Aufgabe direkt neben der Eingabe überprüfen und bei Bedarf verbessern.</p>${allChecked&&right===list.length?`<button onclick="finishRound()">${index<13?'Arbeitsblatt abschließen und weiter →':'Arbeitsblatt abschließen ✓'}</button>`:''}</div>`;
function exampleGroup(q){if(index===0)return 'Einmaleins';if(index===1)return 's2-'+q.section;if(index===3)return 's4-'+q.section;if(index>=4)return q.group;if(q.kind==='number'){let p=q.prompt;return p.startsWith('Addiere')?'Addition':p.startsWith('Berechne die Differenz')?'Subtraktion':p.includes(' × ')?'Multiplikation':p.includes(' : ')?'Division ohne Rest':p.startsWith('Sachaufgabe')?'Sachaufgabe':'Summe multiplizieren'}return q.kind}
let shownGroups=new Set();let questionsHTML='';for(let i=0;i<visible.length;i++){let q=visible[i],group=exampleGroup(q);if(!shownGroups.has(group)){shownGroups.add(group);questionsHTML+=`<div class="group-example"><h3>💡 Musterbeispiel: ${safe(index===0?'Einmaleins':index===1?sections[q.section]:index===3?sections4[q.section]:index>=4?q.group:({'lineRead':'Zahl am Zahlenstrahl ablesen','lineTap':'Zahl am Zahlenstrahl markieren','compare':'Zahlen vergleichen','neighbors':'Vorgänger und Nachfolger','order':'Zahlen sortieren','Addition':'Schriftlich addieren','Subtraktion':'Subtrahieren','Multiplikation':'Multiplizieren','Division ohne Rest':'Dividieren','division':'Division mit Rest','Sachaufgabe':'Sachaufgabe','Summe multiplizieren':'Summe multiplizieren'})[group]||group)}</h3>${workedExample(q)}</div>`;}questionsHTML+=questionHTML(q,i)}
html+=`<div class="card"><div class="questions">${questionsHTML}</div><div class="actions"><button class="secondary" onclick="home()">← Zur Übersicht</button></div></div><div class="card"><details><summary><b>Lernstand und Einstellungen</b></summary><p class="small muted">Dein Lernstand wird auf diesem Gerät gespeichert.</p><button style="background:#a33434" onclick="resetAll()">Lernprogramm zurücksetzen</button></details></div>`;$('app').innerHTML=html}
window.gridAnswer=(id,i,v)=>{const q=pending(currentSheet()).find(x=>x.id===id);let a=(state.inputs[id]||'').split('|');while(a.length<7)a.push('');a[i]=String(v).replace(/\D/g,'').slice(-1);state.inputs[id]=a.join('|');delete review[id];storeReview()};
window.choose=(id,v)=>{state.inputs[id]=v;delete review[id];storeReview();render()};
window.pairAnswer=(id,which,v)=>{let a=(state.inputs[id]||'|').split('|');a[which]=v;state.inputs[id]=a.join('|');delete review[id];storeReview()};
window.pickGroup=(id,i)=>{let a=(state.inputs[id]||'').split('|').filter(Boolean);if(a.includes(String(i)))a=a.filter(x=>x!==String(i));else if(a.length<2)a.push(String(i));state.inputs[id]=a.join('|');delete review[id];storeReview();render()};
window.pickOrder=(id,n)=>{let a=(state.inputs[id]||'').split('|').filter(Boolean);if(!a.includes(String(n)))a.push(String(n));state.inputs[id]=a.join('|');delete review[id];storeReview();render()};
window.tapLine=(ev,id)=>{if(review[id]===true)return;let rect=ev.currentTarget.getBoundingClientRect(),index=Math.max(0,Math.min(10,Math.round((ev.clientX-rect.left)/rect.width*10)));state.inputs[id]=String(index);delete review[id];storeReview();render()};
window.answer=(id,value)=>{state.inputs[id]=value;delete review[id];storeReview()};
window.retryOne=id=>{state.inputs[id]='';delete review[id];storeReview();render();const el=[...document.querySelectorAll('.question')].find(e=>e.querySelector(`button[onclick="checkOne('${id}')"]`));el?.querySelector('input:not([disabled])')?.focus();el?.scrollIntoView({block:'nearest'});};
window.checkOne=id=>{let q=pending(currentSheet()).find(x=>x.id===id);if(!q)return;let value=state.inputs[id];if(value===undefined||String(value).trim()===''||value==='|'||(q.kind==='digitGrid'&&!String(value).split('|').some(Boolean))){alert('Bitte zuerst eine Antwort eingeben.');return}review[id]=correct(q,value);storeReview();render();let el=[...document.querySelectorAll('.question')].find(e=>e.querySelector(`button[onclick="checkOne('${id}')"]`));if(el)el.scrollIntoView({block:'nearest'});};
window.setSection=v=>{section=v;render()};
window.home=()=>{storeReview();page='home';checked=null;section='all';save();render();window.scrollTo({top:0,behavior:'smooth'})};
window.go=i=>{storeReview();state.current=i;loadReview();page='sheet';checked=null;section='all';save();render();window.scrollTo({top:0,behavior:'smooth'})};
window.finishRound=()=>{let sh=currentSheet(),qs=pending(sh);if(!qs.every(q=>review[q.id]===true))return;sh.done=true;sh.remaining=[];sh.review={};review={};if(state.current<13)state.current++;loadReview();page='home';section='all';save();render();window.scrollTo({top:0,behavior:'smooth'})};
loadReview();
window.resetAll=()=>{if(confirm('Wirklich den gesamten Lernstand löschen und neue Aufgaben erstellen?')){state=initial();review={};checked=null;section='all';save();render()}};
save();render();
</script></body></html>
